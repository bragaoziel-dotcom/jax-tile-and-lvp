name: Fix Logo WebP

on:
  push:
    branches: [fix/valid-logo-webp]

permissions:
  contents: write

jobs:
  rebuild-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/valid-logo-webp
      - name: Build valid cropped WebP from approved PNG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('assets/jax-tile-lvp-logo.png').convert('RGB')
          # Crop only unused white canvas. This 1370x355 crop matches the existing
          # header/footer display ratio without altering the approved logo artwork.
          out = src.crop((39, 350, 1409, 705))
          assert out.size == (1370, 355)
          out.save('assets/jax-tile-lvp-logo.webp', 'WEBP', quality=95, method=6)
          check = Image.open('assets/jax-tile-lvp-logo.webp')
          check.verify()
          PY
          rm .github/workflows/fix-logo-webp.yml
          node scripts/validate-site.mjs
          node scripts/validate-assets.mjs
      - name: Commit valid logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild logo as valid optimized WebP"
          git push origin HEAD:fix/valid-logo-webp
