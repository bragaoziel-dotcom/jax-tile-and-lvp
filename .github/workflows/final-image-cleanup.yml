name: Final Image Cleanup

on:
  push:
    branches: [perf/final-image-cleanup]

permissions:
  contents: write

jobs:
  cleanup-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/final-image-cleanup
      - name: Optimize PNG and reserve project image layout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          logo = Path('assets/jax-tile-lvp-logo.png')
          src = Image.open(logo).convert('RGB')
          out = src.crop((39, 350, 1409, 705))
          assert out.size == (1370, 355)
          out.save(logo, 'PNG', optimize=True)
          check = Image.open(logo)
          check.verify()

          replacements = {
              'src="/assets/projects/lvp-open-room.webp"': 'src="/assets/projects/lvp-open-room.webp" width="900" height="1200"',
              'src="/assets/projects/tile-shower-marble.webp"': 'src="/assets/projects/tile-shower-marble.webp" width="900" height="1200"',
          }
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/final-image-cleanup.yml
          node scripts/validate-site.mjs
          node scripts/validate-assets.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish image optimization and CLS safeguards"
          git push origin HEAD:perf/final-image-cleanup
