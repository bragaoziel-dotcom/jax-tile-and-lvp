name: Site Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate static site
        run: node scripts/validate-site.mjs
      - name: Validate optimized assets
        run: node scripts/validate-assets.mjs

  package-production:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 404.html index.html robots.txt sitemap.xml dist/
          cp -R api assets contact floor-removal-preparation portugues privacy projects service-areas tile-installation-jacksonville vinyl-flooring-jacksonville dist/
          (cd dist && zip -qr ../jax-tile-and-lvp-production.zip .)
          test -s jax-tile-and-lvp-production.zip
      - name: Upload validated production package
        uses: actions/upload-artifact@v4
        with:
          name: jax-tile-and-lvp-production
          path: jax-tile-and-lvp-production.zip
          if-no-files-found: error
          retention-days: 30

  verify-production:
    name: Verify Hostinger production
    needs: [validate, package-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger Git auto-deployment
        run: sleep 20
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://jaxtileandlvp.com/ | grep -q 'Jax Tile &amp; LVP'; then
              echo 'Hostinger production is online.'
              exit 0
            fi
            echo "Waiting for Hostinger deployment (attempt $attempt/6)..."
            sleep 10
          done
          echo '::error::Production homepage verification did not pass after Hostinger deployment window.'
          exit 1
